[package]
name = "omml-rs"
version = "0.1.0"
edition = "2021"
description = "Generated native OMML models and XML codecs"
license = "BSD-2-Clause"

[lib]
name = "omml"
crate-type = ["rlib", "cdylib"]

[features]
default = []
model-serde = []

[dependencies]
lutaml-rs = { version = "=0.1.0", default-features = false, features = ["xml"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision", "preserve_order"] }
regex = "=1.13.1"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
