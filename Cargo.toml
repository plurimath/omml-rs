[package]
name = "omml-rs"
version = "0.1.0"
repository = "https://github.com/plurimath/omml-rs"
edition = "2021"
description = "Generated native OMML models and XML codecs"
license = "BSD-2-Clause"

[lib]
name = "omml"
crate-type = ["rlib", "cdylib"]

[features]
default = []
model-serde = []

# The replay compares each parsed model with the testsuite's Ruby model wire
# through the models' serde JSON.
[[test]]
name = "corpus_replay"
required-features = ["model-serde"]

[dependencies]
# TEMPORARY: pin to lutaml merge commit once lutaml-rs#10 / lutaml-ts#3 land (fork head of lutaml-rs#10).
lutaml-rs = { version = "=0.1.0", git = "https://github.com/suleman-uzair/lutaml-rs", rev = "828275bd28facc7af8caf5c0fa402ec6962369df", default-features = false, features = ["xml"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision", "preserve_order"] }
regex = "=1.13.1"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
